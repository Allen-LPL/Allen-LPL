name: Latest blog posts

# Pulls the newest posts from the blog RSS feed and writes them into README.md
# between the BLOG-POST-LIST markers. No token/secret needed.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest posts into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.liupengliang.com/index.xml"
          max_post_count: 5
          # Leading $newline forces the first item off the marker line, otherwise
          # it glues to `<!-- ...START -->`, becomes an HTML block, and the first
          # link renders as a raw URL instead of its title.
          template: "$newline- [$title]($url) <sub>$date</sub>"
          date_format: "yyyy-mm-dd"
          commit_message: "chore: refresh latest blog posts"
